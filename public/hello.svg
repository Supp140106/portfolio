<svg width="2048" height="1365" viewBox="0 0 2048 1365" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="planetGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff4fd8"/>
      <stop offset="60%" stop-color="#8e2a86"/>
      <stop offset="100%" stop-color="#4a1348"/>
    </radialGradient>

    <linearGradient id="craterShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a1348" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff4fd8" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="grainy">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <circle cx="1024" cy="1600" r="1000" fill="url(#planetGradient)" />
  
  <circle cx="1024" cy="1600" r="1000" fill="white" opacity="0.05" filter="url(#grainy)"/>

  <g transform="translate(850, 850)">
    <circle r="60" fill="black" opacity="0.2" />
    <circle cx="-3" cy="-3" r="58" fill="url(#craterShadow)" />
  </g>

  <g transform="translate(1100, 750)">
    <circle r="40" fill="black" opacity="0.2" />
    <circle cx="-2" cy="-2" r="38" fill="url(#craterShadow)" />
  </g>

  <g transform="translate(1300, 950)">
    <circle r="80" fill="black" opacity="0.15" />
    <circle cx="-4" cy="-4" r="77" fill="url(#craterShadow)" />
  </g>

  <g transform="translate(600, 1000)">
    <circle r="30" fill="black" opacity="0.2" />
    <circle cx="-2" cy="-2" r="28" fill="url(#craterShadow)" />
  </g>
</svg>